[project]
name = "llmagentbrain-platform"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501", # allow long lines in embedded HTML/JS strings
]

[tool.ruff.lint.per-file-ignores]
"src/web/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false

# Avoid noisy false-positives from embedded/optional integrations.
[mypy-src.web.dashboard]
ignore_errors = true
