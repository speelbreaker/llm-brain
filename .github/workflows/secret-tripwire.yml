name: Secret Tripwire

on:
  pull_request:
  push:
    branches:
      - main
      - pr-autofix-push-mode

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run secret tripwire
        run: python scripts/secret_tripwire.py
