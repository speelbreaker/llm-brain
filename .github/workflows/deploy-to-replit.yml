name: Deploy to Replit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Replit Deploy Hook
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.REPLIT_DEPLOY_URL }}/deploy-hook" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -d '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "message": "${{ github.event.head_commit.message }}"}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"
          
          if [ "$http_code" -ge 400 ]; then
            echo "Deploy hook failed with status $http_code"
            exit 1
          fi
          
          echo "Deploy hook triggered successfully"
