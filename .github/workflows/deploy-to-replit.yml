name: Deploy to Replit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Replit Deploy Hook
        run: |
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "message": os.environ.get("COMMIT_MESSAGE", ""),
          }))
          PY
          )

          set +e
          response=$(curl --show-error --silent -w "\n%{http_code}" -X POST \
            --connect-timeout 10 \
            --max-time 60 \
            "${{ secrets.REPLIT_DEPLOY_URL }}/deploy-hook" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -d "$payload")
          curl_rc=$?
          set -e
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$curl_rc" -ne 0 ]; then
            echo "curl failed with exit code $curl_rc"
            exit $curl_rc
          fi
          
          if [ "$http_code" -ge 400 ]; then
            echo "Deploy hook failed with status $http_code"
            exit 1
          fi
          
          echo "Deploy hook triggered successfully"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
