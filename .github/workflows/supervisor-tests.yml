name: Supervisor Tests

on:
  pull_request:
  push:
    branches:
      - pr-supervisor-smoke

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build supervisor image
        run: docker build -f docker/supervisor.Dockerfile -t pr-supervisor-ci .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run supervisor tests
        run: python -m pytest -q tests/supervisor
