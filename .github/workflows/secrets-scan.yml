name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
      - pr-autofix-push-mode

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.18.4/install.sh | bash -s -- -b /usr/local/bin v8.18.4
      - name: Scan for secrets
        run: gitleaks detect --redact --config .gitleaks.toml
