name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
      - pr-autofix-push-mode
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # daily shallow scan

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.18.4/install.sh | bash -s -- -b /usr/local/bin v8.18.4
      - name: Shallow scan (working tree)
        run: scripts/security/scan_worktree_secrets.sh

  gitleaks-deep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.18.4/install.sh | bash -s -- -b /usr/local/bin v8.18.4
      - name: Deep history scan
        run: scripts/security/scan_git_history_secrets.sh deep
