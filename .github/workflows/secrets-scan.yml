name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  tripwire:
    name: tripwire
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tripwire checks
        run: ./scripts/security/run_security_checks.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (deep)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout (shallow)
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run git history scan (deep)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: ./scripts/security/scan_git_history_secrets.sh --deep

      - name: Run git history scan (shallow)
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: ./scripts/security/scan_git_history_secrets.sh --shallow
