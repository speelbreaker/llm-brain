name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pyright

      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check .

      - name: Typecheck (pyright)
        run: |
          pyright --version
          pyright

      - name: Typecheck (mypy)
        run: |
          mypy --version
          mypy src || true

      - name: Tests
        env:
          DISABLE_BACKGROUND_THREADS: '1'
        run: |
          pytest -q
