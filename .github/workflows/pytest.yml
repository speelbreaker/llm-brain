name: Run Pytest

on:
  push:
    branches: [ main, pr-supervisor-smoke ]
  pull_request:
    branches: [ main, pr-supervisor-smoke ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip, pytest and your dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt || true
      - name: Run Pytest
        run: |
          pytest -q
