version: '3.8'

services:
  supervisor:
    build:
      context: ..
      dockerfile: docker/supervisor.Dockerfile
    container_name: pr-supervisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - supervisor_data:/var/lib/pr_supervisor
    env_file:
      - .env.supervisor
    environment:
      - SUPERVISOR_ENABLED=1
      - SUPERVISOR_BASE_JOBS_DIR=/var/lib/pr_supervisor/jobs
      - SUPERVISOR_STORE_PATH=/var/lib/pr_supervisor/store.jsonl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  supervisor_data:
    driver: local
